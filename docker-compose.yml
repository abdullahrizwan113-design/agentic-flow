services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: agentic_flow_backend
    ports:
      - "8000:8000"
    environment:
      # Asal key ab hum yahan nahi likhenge, server par manually set karenge
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      # Database file ko container ke bahar save rakhega
      - ./agentic_flow.db:/app/agentic_flow.db
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: agentic_flow_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always